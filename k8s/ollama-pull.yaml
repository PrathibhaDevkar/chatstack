apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama
          env:
            - name: OLLAMA_HOST
              value: "ollama:11434"
          command: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull llama3.2:1b"]