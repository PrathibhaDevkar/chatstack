services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chat
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chat -d chat"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    # ports:
    #   - "8003:8000"
    environment:
      DATABASE_URL: "postgresql://chat:${DB_PASSWORD}@db:5432/chat"
      OLLAMA_URL: "http://ollama:11434"
      MODEL: llama3.2:1b
    depends_on:
      db:
        condition: service_healthy
      ollama: 
        condition: service_started
    restart: unless-stopped

  ollama: 
    image: ollama/ollama
    volumes: 
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull llama3.2:1b"]
    restart: "no"

  frontend: 
    build: ./frontend
    ports: 
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  ollama-models: 